<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Deluxe Remake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #050811 100%);
            overflow: hidden;
        }
        .font-game {
            font-family: 'Fredoka One', cursive;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .btn-action {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }
        .gold-glow {
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.8), 0 0 2px #000;
        }
        canvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-0 md:p-4 bg-slate-950 text-white">

    <!-- Container do Jogo -->
    <div class="relative w-full h-full max-w-md max-h-[900px] md:rounded-3xl overflow-hidden shadow-[0_0_50px_rgba(14,165,233,0.3)] flex flex-col justify-center items-center border-0 md:border-4 border-slate-800/80">
        
        <!-- Canvas principal do Jogo -->
        <canvas id="gameCanvas" class="w-full h-full block bg-sky-400"></canvas>

        <!-- Overlay de HUD -->
        <div id="hud" class="absolute top-4 left-0 right-0 px-6 flex justify-between items-center pointer-events-none z-10 hidden">
            <!-- Score Atual -->
            <div class="flex items-center gap-2 bg-slate-900/75 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/20 shadow-lg">
                <span class="text-xs uppercase font-black text-slate-300 tracking-wider">Pontos</span>
                <span id="hudScore" class="font-game text-2xl text-yellow-400">0</span>
            </div>
            <!-- Moedas Coletadas -->
            <div class="flex items-center gap-2 bg-slate-900/75 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/20 shadow-lg">
                <svg class="w-6 h-6 text-yellow-400 fill-current animate-bounce drop-shadow-[0_0_8px_rgba(250,204,21,0.8)]" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" class="text-yellow-500 fill-current"/>
                    <circle cx="12" cy="12" r="7" class="text-yellow-300 fill-current"/>
                    <text x="12" y="16" font-size="10" font-weight="bold" text-anchor="middle" fill="#854d0e">$</text>
                </svg>
                <span id="hudCoins" class="font-game text-2xl text-yellow-300 gold-glow">0</span>
            </div>
        </div>

        <!-- Tela Principal / Menu Inicial -->
        <div id="mainMenu" class="absolute inset-0 flex flex-col items-center justify-between p-6 z-20 bg-black/30 backdrop-blur-[2px]">
            <div class="mt-8 text-center animate-pulse">
                <h1 class="font-game text-5xl md:text-6xl text-yellow-400 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] tracking-wider">
                    FLAPPY BIRD<br><span class="text-sky-300">REMAKE</span>
                </h1>
                <p class="text-xs font-bold tracking-widest text-slate-200 mt-2 uppercase bg-slate-900/60 py-1 px-3 rounded-full border border-white/10">
                    Remake Mobile & Tablet
                </p>
            </div>

            <div class="w-full space-y-4 max-w-xs mb-8">
                <button id="btnStart" class="btn-action w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-game text-2xl py-4 rounded-2xl border-2 border-emerald-300 flex items-center justify-center gap-3 shadow-lg shadow-emerald-500/20">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    JOGAR NOW
                </button>

                <button id="btnShop" class="btn-action w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-game text-2xl py-3.5 rounded-2xl border-2 border-yellow-200 flex items-center justify-center gap-3 shadow-lg shadow-amber-500/20">
                    <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24">
                        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                    LOJA DE SKINS
                </button>
            </div>

            <div class="glass-panel px-5 py-2.5 rounded-2xl flex items-center gap-3 border border-yellow-500/30">
                <span class="text-xs font-black text-slate-300 uppercase">Suas Moedas:</span>
                <span id="menuCoins" class="font-game text-xl text-yellow-400 gold-glow">0</span>
            </div>
        </div>

        <!-- Pop-up da Loja de Skins -->
        <div id="shopModal" class="absolute inset-0 z-30 bg-slate-950/95 backdrop-blur-xl p-5 flex flex-col justify-between hidden">
            <!-- Header Móvel Elegante -->
            <div class="flex justify-between items-center bg-slate-900/90 border border-slate-800/80 p-4 rounded-3xl shadow-2xl shadow-yellow-500/5">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 rounded-2xl bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-300 text-slate-950 font-black shadow-lg shadow-amber-500/25">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="font-game text-2xl text-yellow-400 leading-none drop-shadow-md">LOJA DE SKINS</h2>
                        <p class="text-[10px] text-amber-300/80 font-black uppercase tracking-wider mt-1">Coleção Exclusiva</p>
                    </div>
                </div>
                <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 border border-yellow-500/40 bg-amber-500/10 shadow-inner">
                    <svg class="w-5 h-5 text-yellow-400 fill-current drop-shadow-[0_0_8px_rgba(250,204,21,0.8)]" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" class="text-yellow-500 fill-current"/>
                        <circle cx="12" cy="12" r="7" class="text-yellow-300 fill-current"/>
                        <text x="12" y="16" font-size="10" font-weight="bold" text-anchor="middle" fill="#854d0e">$</text>
                    </svg>
                    <span id="shopCoins" class="font-game text-xl text-yellow-300 gold-glow">0</span>
                </div>
            </div>

            <!-- Grid Scrollável de Skins -->
            <div id="skinsContainer" class="grid grid-cols-2 gap-3.5 my-3.5 overflow-y-auto max-h-[60vh] p-1 pr-1.5 scrollbar-thin">
                <!-- Preenchido via JavaScript -->
            </div>

            <!-- Botão Fechar de Rodapé -->
            <button id="btnCloseShop" class="btn-action w-full bg-gradient-to-r from-slate-800 to-slate-900 hover:from-slate-700 hover:to-slate-800 text-slate-200 font-game text-lg py-3.5 rounded-2xl border border-slate-700/80 shadow-2xl flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-slate-400 fill-current" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                VOLTAR AO MENU
            </button>
        </div>

        <!-- Modal de Game Over -->
        <div id="gameOverModal" class="absolute inset-0 z-30 bg-slate-950/85 backdrop-blur-xl p-6 flex flex-col items-center justify-center hidden">
            <div class="glass-panel w-full max-w-xs p-6 rounded-3xl text-center border-2 border-red-500/40 shadow-[0_0_50px_rgba(239,68,68,0.25)] space-y-4 animate-in fade-in zoom-in-95 duration-200">
                <!-- Ícone de Troféu / Derrota -->
                <div class="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-br from-red-500/20 to-orange-500/10 border border-red-500/30 flex items-center justify-center text-red-500 shadow-lg shadow-red-500/10">
                    <svg class="w-10 h-10 fill-current drop-shadow-[0_0_10px_rgba(239,68,68,0.6)]" viewBox="0 0 24 24">
                        <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V18H8v2h8v-2h-3v-2.1c1.86-.48 3.25-2 3.61-3.96C19.08 11.63 21 9.55 21 7V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/>
                    </svg>
                </div>

                <h2 class="font-game text-4xl text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-orange-400 to-amber-400 tracking-wider drop-shadow-lg">FIM DE JOGO</h2>
                
                <div class="bg-slate-900/90 p-4 rounded-2xl space-y-3 border border-slate-800 shadow-inner">
                    <div class="flex justify-between items-center px-1">
                        <span class="text-xs font-black text-slate-400 uppercase tracking-wider">Pontuação</span>
                        <span id="finalScore" class="font-game text-3xl text-white">0</span>
                    </div>
                    <div class="flex justify-between items-center border-t border-slate-800/80 pt-2.5 px-1">
                        <span class="text-xs font-black text-slate-400 uppercase tracking-wider">Melhor Score</span>
                        <span id="bestScore" class="font-game text-2xl text-yellow-400 gold-glow">0</span>
                    </div>
                    <div class="flex justify-between items-center border-t border-slate-800/80 pt-2.5 px-1 bg-amber-500/5 -mx-4 -mb-4 p-3 rounded-b-2xl border-t-amber-500/20">
                        <span class="text-xs font-black text-amber-300 uppercase tracking-wider">Moedas Ganhas</span>
                        <div class="flex items-center gap-1.5">
                            <svg class="w-5 h-5 text-yellow-400 fill-current drop-shadow-[0_0_6px_rgba(250,204,21,0.8)]" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" class="text-yellow-500 fill-current"/>
                                <circle cx="12" cy="12" r="7" class="text-yellow-300 fill-current"/>
                                <text x="12" y="16" font-size="10" font-weight="bold" text-anchor="middle" fill="#854d0e">$</text>
                            </svg>
                            <span id="earnedCoins" class="font-game text-2xl text-yellow-300 gold-glow">+0</span>
                        </div>
                    </div>
                </div>

                <div class="space-y-2.5 pt-1">
                    <button id="btnRestart" class="btn-action w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-game text-xl py-3.5 rounded-2xl border-2 border-emerald-300/50 shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                        JOGAR NOVAMENTE
                    </button>
                    <button id="btnBackMenu" class="btn-action w-full bg-slate-800/90 hover:bg-slate-700/90 text-slate-300 font-game text-base py-3 rounded-2xl border border-slate-700/80 shadow-md">
                        MENU PRINCIPAL
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Script Principal do Jogo -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Elementos UI
        const hud = document.getElementById('hud');
        const hudScore = document.getElementById('hudScore');
        const hudCoins = document.getElementById('hudCoins');
        const mainMenu = document.getElementById('mainMenu');
        const shopModal = document.getElementById('shopModal');
        const gameOverModal = document.getElementById('gameOverModal');
        const menuCoins = document.getElementById('menuCoins');
        const shopCoins = document.getElementById('shopCoins');
        const skinsContainer = document.getElementById('skinsContainer');

        // Botões
        const btnStart = document.getElementById('btnStart');
        const btnShop = document.getElementById('btnShop');
        const btnCloseShop = document.getElementById('btnCloseShop');
        const btnRestart = document.getElementById('btnRestart');
        const btnBackMenu = document.getElementById('btnBackMenu');

        // Configuração do Estado do Jogo
        let state = {
            current: 'MENU',
            score: 0,
            coinsCollected: 0,
            totalCoins: 0,
            highScore: 0,
            activeSkin: 'yellow',
            unlockedSkins: ['yellow']
        };

        const SKINS = {
            yellow: {
                id: 'yellow',
                name: 'Clássico 3D',
                color: '#facc15',
                darkColor: '#ca8a04',
                beakColor: '#f97316',
                wingColor: '#eab308',
                eyeColor: '#ffffff',
                price: 0
            },
            cyber: {
                id: 'cyber',
                name: 'Cyberpunk 3D',
                color: '#06b6d4',
                darkColor: '#0891b2',
                beakColor: '#ec4899',
                wingColor: '#3b82f6',
                eyeColor: '#a855f7',
                price: 300
            },
            fire: {
                id: 'fire',
                name: 'Fênix 3D',
                color: '#ef4444',
                darkColor: '#b91c1c',
                beakColor: '#f59e0b',
                wingColor: '#dc2626',
                eyeColor: '#fef08a',
                price: 300
            },
            shadow: {
                id: 'shadow',
                name: 'Sombra 3D',
                color: '#475569',
                darkColor: '#1e293b',
                beakColor: '#94a3b8',
                wingColor: '#0f172a',
                eyeColor: '#ef4444',
                price: 300
            },
            galaxy: {
                id: 'galaxy',
                name: 'Galáxia 3D',
                color: '#8b5cf6',
                darkColor: '#581c87',
                beakColor: '#f43f5e',
                wingColor: '#c084fc',
                eyeColor: '#38bdf8',
                price: 500
            },
            emerald: {
                id: 'emerald',
                name: 'Esmeralda 3D',
                color: '#10b981',
                darkColor: '#047857',
                beakColor: '#f59e0b',
                wingColor: '#34d399',
                eyeColor: '#ffffff',
                price: 500
            },
            neon: {
                id: 'neon',
                name: 'Neon Toxic',
                color: '#84cc16',
                darkColor: '#3f6212',
                beakColor: '#a855f7',
                wingColor: '#bef264',
                eyeColor: '#facc15',
                price: 500
            },
            golden: {
                id: 'golden',
                name: 'Ouro Puro 3D',
                color: '#f59e0b',
                darkColor: '#b45309',
                beakColor: '#ea580c',
                wingColor: '#fef08a',
                eyeColor: '#ffffff',
                price: 500
            }
        };

        // Audio Context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(380, now);
                osc.frequency.exponentialRampToValueAtTime(750, now + 0.1);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'coin') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(987.77, now);
                osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Passarinho com gravidade um pouco mais lenta
        const bird = {
            x: 80,
            y: 0,
            radius: 18,
            gravity: 0.175, // Queda um pouco mais lenta
            velocity: 0,
            jumpForce: -4.1, // Pulo calibrado para a nova gravidade leve
            rotation: 0,
            wingAngle: 0,
            wingSpeed: 0.12,

            reset() {
                this.y = canvas.height / 2;
                this.velocity = 0;
                this.rotation = 0;
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, this.velocity * 0.07));
                this.wingAngle += this.wingSpeed;

                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },

            jump() {
                this.velocity = this.jumpForce;
                playSound('jump');
            },

            draw() {
                const groundY = canvas.height - 56;
                const skin = SKINS[state.activeSkin];

                // 2.5D Projeção de Sombra realista no Chão
                const distToGround = Math.max(0, groundY - this.y);
                const shadowScale = Math.max(0.3, 1 - distToGround / (canvas.height * 0.8));
                const shadowAlpha = Math.max(0.08, 0.35 - distToGround / (canvas.height * 1.2));
                const shadowX = this.x + (distToGround * 0.15) + 12; // Projeção angular isometrica

                ctx.save();
                ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
                ctx.beginPath();
                ctx.ellipse(shadowX, groundY + 4, this.radius * 1.3 * shadowScale, this.radius * 0.4 * shadowScale, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Desenho do Pássaro em 2.5D
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Glow Neon
                ctx.save();
                ctx.shadowColor = skin.color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = skin.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Volume Tridimensional (Efeito de Esfera 3D)
                const depthOffset = 6;
                // Face Traseira (Escura)
                ctx.fillStyle = skin.darkColor;
                ctx.beginPath();
                ctx.arc(-depthOffset / 2, depthOffset / 2, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Face Frontal Luminosa (Gradiente Radial)
                const birdGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, this.radius);
                birdGrad.addColorStop(0, '#ffffff');
                birdGrad.addColorStop(0.3, skin.color);
                birdGrad.addColorStop(1, skin.darkColor);

                ctx.fillStyle = birdGrad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                // Asa 3D Animada
                const wingY = Math.sin(this.wingAngle) * 4;
                const wingGrad = ctx.createLinearGradient(-15, wingY, 3, wingY);
                wingGrad.addColorStop(0, skin.wingColor);
                wingGrad.addColorStop(1, '#ffffff');

                ctx.fillStyle = wingGrad;
                ctx.beginPath();
                ctx.ellipse(-6, wingY, 10, 6, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Olho 3D saliente
                ctx.fillStyle = skin.eyeColor;
                ctx.beginPath();
                ctx.arc(7, -6, 6.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Pupila + Brilho
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(9, -6, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(10, -7.5, 1, 0, Math.PI * 2);
                ctx.fill();

                // Bico 3D com Volume
                const beakGrad = ctx.createLinearGradient(10, 0, 22, 0);
                beakGrad.addColorStop(0, skin.beakColor);
                beakGrad.addColorStop(1, '#fed7aa');

                ctx.fillStyle = beakGrad;
                ctx.beginPath();
                ctx.moveTo(10, -3);
                ctx.lineTo(23, 1);
                ctx.lineTo(10, 7);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        };

        // Canos em 2.5D Isometricos
        const pipes = {
            list: [],
            width: 64,
            depth: 14, // Profundidade 3D lateral
            gap: 182,
            speed: 1.6,
            spawnTimer: 0,
            spawnInterval: 165,
            lastTopHeight: null,

            reset() {
                this.list = [];
                this.spawnTimer = 0;
                this.lastTopHeight = null;
            },

            update() {
                this.spawnTimer++;
                if (this.spawnTimer >= this.spawnInterval) {
                    this.spawnTimer = 0;
                    this.spawnPipe();
                }

                for (let i = this.list.length - 1; i >= 0; i--) {
                    const p = this.list[i];
                    p.x -= this.speed;

                    if (!p.passed && p.x + this.width < bird.x) {
                        p.passed = true;
                        state.score++;
                        state.coinsCollected += 2;
                        playSound('coin');
                        updateHUD();
                    }

                    if (p.x + this.width + this.depth < -20) {
                        this.list.splice(i, 1);
                    }
                }
            },

            spawnPipe() {
                const minTop = 60;
                const maxTop = canvas.height - this.gap - 120;
                let topHeight;

                if (this.lastTopHeight === null) {
                    topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
                } else {
                    const maxDelta = 110;
                    const minPossible = Math.max(minTop, this.lastTopHeight - maxDelta);
                    const maxPossible = Math.min(maxTop, this.lastTopHeight + maxDelta);
                    topHeight = Math.floor(Math.random() * (maxPossible - minPossible + 1)) + minPossible;
                }

                this.lastTopHeight = topHeight;

                this.list.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: canvas.height - topHeight - this.gap,
                    passed: false,
                    coinPulse: 0
                });
            },

            drawPipe3D(x, y, width, height, isTop) {
                const depth = this.depth;
                const lipHeight = 24;

                // Gradiente Frontal
                const frontGrad = ctx.createLinearGradient(x, 0, x + width, 0);
                frontGrad.addColorStop(0, '#14532d');
                frontGrad.addColorStop(0.25, '#22c55e');
                frontGrad.addColorStop(0.6, '#86efac');
                frontGrad.addColorStop(0.85, '#22c55e');
                frontGrad.addColorStop(1, '#15803d');

                // Lado Lateral 3D (Sombra)
                const sideGrad = ctx.createLinearGradient(x + width, 0, x + width + depth, 0);
                sideGrad.addColorStop(0, '#052e16');
                sideGrad.addColorStop(1, '#022c22');

                ctx.strokeStyle = '#022c22';
                ctx.lineWidth = 2.5;

                // 1. Corpo Principal Frontal
                ctx.fillStyle = frontGrad;
                ctx.fillRect(x, y, width, height);
                ctx.strokeRect(x, y, width, height);

                // 2. Lado Lateral 3D
                ctx.fillStyle = sideGrad;
                ctx.beginPath();
                ctx.moveTo(x + width, y);
                ctx.lineTo(x + width + depth, y - depth * 0.5);
                ctx.lineTo(x + width + depth, y + height - depth * 0.5);
                ctx.lineTo(x + width, y + height);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 3. Anel/Boca do Cano (Borda 3D)
                const lipY = isTop ? y + height - lipHeight : y;
                const lipWidth = width + 10;
                const lipX = x - 5;

                ctx.fillStyle = frontGrad;
                ctx.fillRect(lipX, lipY, lipWidth, lipHeight);
                ctx.strokeRect(lipX, lipY, lipWidth, lipHeight);

                // Lado 3D da Boca do Cano
                ctx.fillStyle = sideGrad;
                ctx.beginPath();
                ctx.moveTo(lipX + lipWidth, lipY);
                ctx.lineTo(lipX + lipWidth + depth, lipY - depth * 0.5);
                ctx.lineTo(lipX + lipWidth + depth, lipY + lipHeight - depth * 0.5);
                ctx.lineTo(lipX + lipWidth, lipY + lipHeight);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Topo/Fundo 3D da Boca do Cano
                ctx.fillStyle = '#4ade80';
                ctx.beginPath();
                if (isTop) {
                    ctx.moveTo(lipX, lipY + lipHeight);
                    ctx.lineTo(lipX + depth, lipY + lipHeight - depth * 0.5);
                    ctx.lineTo(lipX + lipWidth + depth, lipY + lipHeight - depth * 0.5);
                    ctx.lineTo(lipX + lipWidth, lipY + lipHeight);
                } else {
                    ctx.moveTo(lipX, lipY);
                    ctx.lineTo(lipX + depth, lipY - depth * 0.5);
                    ctx.lineTo(lipX + lipWidth + depth, lipY - depth * 0.5);
                    ctx.lineTo(lipX + lipWidth, lipY);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            },

            draw() {
                this.list.forEach(p => {
                    p.coinPulse = (p.coinPulse || 0) + 0.05;

                    // Cano Superior
                    this.drawPipe3D(p.x, 0, this.width, p.top, true);

                    // Cano Inferior
                    const bottomY = canvas.height - p.bottom;
                    this.drawPipe3D(p.x, bottomY, this.width, p.bottom, false);

                    // Moeda HD 3D Giratória
                    if (!p.passed) {
                        const coinY = p.top + this.gap / 2 + Math.sin(p.coinPulse) * 4;
                        const coinX = p.x + this.width / 2;
                        const coinScaleX = Math.cos(p.coinPulse * 2.5);

                        ctx.save();
                        ctx.translate(coinX, coinY);
                        ctx.scale(coinScaleX, 1);

                        ctx.shadowColor = '#facc15';
                        ctx.shadowBlur = 12;

                        const goldGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
                        goldGrad.addColorStop(0, '#fef08a');
                        goldGrad.addColorStop(0.5, '#facc15');
                        goldGrad.addColorStop(1, '#ca8a04');

                        ctx.fillStyle = goldGrad;
                        ctx.strokeStyle = '#78350f';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 0, 13, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();

                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#78350f';
                        ctx.font = '900 13px Nunito';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('$', 0, 0.5);
                        ctx.restore();
                    }
                });
            }
        };

        const environment = {
            clouds: [],
            mountains: [],
            particles: [],
            groundOffset: 0,

            init() {
                this.clouds = [
                    { x: 40, y: 70, speed: 0.25, scale: 0.9, opacity: 0.85 },
                    { x: 200, y: 130, speed: 0.35, scale: 1.3, opacity: 0.7 },
                    { x: 360, y: 50, speed: 0.2, scale: 1.1, opacity: 0.8 }
                ];

                // Montanhas de Fundo Parallax 2.5D
                this.mountains = [
                    { x: 0, width: 180, height: 110 },
                    { x: 140, width: 220, height: 150 },
                    { x: 320, width: 200, height: 95 }
                ];

                this.particles = Array.from({ length: 18 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height - 100),
                    radius: Math.random() * 2 + 1,
                    speedX: Math.random() * 0.4 + 0.1,
                    speedY: (Math.random() - 0.5) * 0.2,
                    alpha: Math.random() * 0.5 + 0.2
                }));
            },

            update() {
                this.groundOffset = (this.groundOffset + pipes.speed) % 24;
                
                this.clouds.forEach(c => {
                    c.x -= c.speed;
                    if (c.x < -120) c.x = canvas.width + 60;
                });

                this.mountains.forEach(m => {
                    m.x -= pipes.speed * 0.15; // Velocidade lenta Parallax
                    if (m.x + m.width < 0) m.x = canvas.width + 40;
                });

                this.particles.forEach(pt => {
                    pt.x -= pt.speedX;
                    pt.y += pt.speedY;
                    if (pt.x < -10) {
                        pt.x = canvas.width + 10;
                        pt.y = Math.random() * (canvas.height - 100);
                    }
                });
            },

            draw() {
                // Céu Gradiente
                const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGrad.addColorStop(0, '#0284c7');
                skyGrad.addColorStop(0.4, '#38bdf8');
                skyGrad.addColorStop(0.75, '#bae6fd');
                skyGrad.addColorStop(1, '#f0f9ff');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Montanhas 2.5D Parallax em Camadas
                const groundHeight = 56;
                const groundY = canvas.height - groundHeight;

                this.mountains.forEach(m => {
                    ctx.save();
                    const mGrad = ctx.createLinearGradient(0, groundY - m.height, 0, groundY);
                    mGrad.addColorStop(0, '#38bdf8');
                    mGrad.addColorStop(1, '#1e3a8a');

                    ctx.fillStyle = mGrad;
                    ctx.beginPath();
                    ctx.moveTo(m.x, groundY);
                    ctx.lineTo(m.x + m.width / 2, groundY - m.height);
                    ctx.lineTo(m.x + m.width, groundY);
                    ctx.closePath();
                    ctx.fill();

                    // Sombra da Montanha 2.5D
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.18)';
                    ctx.beginPath();
                    ctx.moveTo(m.x + m.width / 2, groundY - m.height);
                    ctx.lineTo(m.x + m.width, groundY);
                    ctx.lineTo(m.x + m.width / 2, groundY);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                });

                // Nuvens
                this.clouds.forEach(c => {
                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.scale(c.scale, c.scale);
                    ctx.fillStyle = `rgba(255, 255, 255, ${c.opacity})`;
                    ctx.shadowColor = 'rgba(14, 165, 233, 0.3)';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.arc(18, -10, 25, 0, Math.PI * 2);
                    ctx.arc(40, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Partículas Mágicas
                this.particles.forEach(pt => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${pt.alpha})`;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Chão Isometrico 2.5D
                const earthGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
                earthGrad.addColorStop(0, '#ca8a04');
                earthGrad.addColorStop(1, '#854d0e');

                ctx.fillStyle = earthGrad;
                ctx.fillRect(0, groundY, canvas.width, groundHeight);

                // Camada de Grama 2.5D
                const grassGrad = ctx.createLinearGradient(0, groundY, 0, groundY + 14);
                grassGrad.addColorStop(0, '#4ade80');
                grassGrad.addColorStop(1, '#16a34a');

                ctx.fillStyle = grassGrad;
                ctx.fillRect(0, groundY, canvas.width, 14);

                // Topo 3D da Grama
                ctx.fillStyle = '#86efac';
                ctx.fillRect(0, groundY, canvas.width, 3);

                // Linha de Divisão HD
                ctx.strokeStyle = '#052e16';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, groundY + 14);
                ctx.lineTo(canvas.width, groundY + 14);
                ctx.stroke();

                // Textura Isométrica do Solo
                ctx.fillStyle = 'rgba(161, 98, 7, 0.5)';
                for (let x = -this.groundOffset; x < canvas.width + 30; x += 24) {
                    ctx.beginPath();
                    ctx.moveTo(x, groundY + 14);
                    ctx.lineTo(x + 12, groundY + groundHeight);
                    ctx.lineTo(x + 18, groundY + groundHeight);
                    ctx.lineTo(x + 6, groundY + 14);
                    ctx.fill();
                }
            }
        };

        function checkCollisions() {
            const groundY = canvas.height - 56;

            if (bird.y + bird.radius - 2 >= groundY) {
                return true;
            }

            const tolerance = 7;
            for (let p of pipes.list) {
                const birdLeft = bird.x - bird.radius + tolerance;
                const birdRight = bird.x + bird.radius - tolerance;
                const birdTop = bird.y - bird.radius + tolerance;
                const birdBottom = bird.y + bird.radius - tolerance;

                const pipeLeft = p.x;
                const pipeRight = p.x + pipes.width;
                const pipeTopHeight = p.top;
                const pipeBottomY = canvas.height - p.bottom;

                if (birdRight > pipeLeft && birdLeft < pipeRight && birdTop < pipeTopHeight) {
                    return true;
                }

                if (birdRight > pipeLeft && birdLeft < pipeRight && birdBottom > pipeBottomY) {
                    return true;
                }
            }

            return false;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            environment.update();
            environment.draw();

            if (state.current === 'PLAYING') {
                bird.update();
                pipes.update();

                if (checkCollisions()) {
                    triggerGameOver();
                }
            }

            pipes.draw();
            bird.draw();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            state.current = 'PLAYING';
            state.score = 0;
            state.coinsCollected = 0;

            bird.reset();
            pipes.reset();
            updateHUD();

            mainMenu.classList.add('hidden');
            gameOverModal.classList.add('hidden');
            shopModal.classList.add('hidden');
            hud.classList.remove('hidden');

            bird.jump();
        }

        function triggerGameOver() {
            playSound('hit');
            state.current = 'GAMEOVER';

            state.totalCoins += state.coinsCollected;
            if (state.score > state.highScore) {
                state.highScore = state.score;
            }

            saveData();

            document.getElementById('finalScore').innerText = state.score;
            document.getElementById('bestScore').innerText = state.highScore;
            document.getElementById('earnedCoins').innerText = `+${state.coinsCollected}`;

            hud.classList.add('hidden');
            gameOverModal.classList.remove('hidden');
        }

        function updateHUD() {
            hudScore.innerText = state.score;
            hudCoins.innerText = state.coinsCollected;
            menuCoins.innerText = state.totalCoins;
            shopCoins.innerText = state.totalCoins;
        }

        function renderShop() {
            skinsContainer.innerHTML = '';

            Object.values(SKINS).forEach(skin => {
                const isUnlocked = state.unlockedSkins.includes(skin.id);
                const isActive = state.activeSkin === skin.id;

                const card = document.createElement('div');
                card.className = `relative p-3.5 rounded-3xl border flex flex-col items-center justify-between text-center transition-all duration-200 backdrop-blur-md overflow-hidden ${
                    isActive 
                        ? 'bg-gradient-to-b from-yellow-500/20 via-slate-900/90 to-slate-950 border-yellow-400 ring-2 ring-yellow-400/50 shadow-xl shadow-yellow-500/20 scale-[1.02]' 
                        : isUnlocked 
                        ? 'bg-slate-900/80 border-slate-700/80 hover:border-slate-600 hover:scale-[1.01]'
                        : 'bg-slate-950/70 border-slate-800/90 hover:border-slate-700 opacity-90'
                }`;

                card.innerHTML = `
                    ${isActive ? '<span class="absolute top-2.5 right-2.5 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 text-[9px] font-black px-2 py-0.5 rounded-full uppercase tracking-tighter shadow-md">Equipado</span>' : ''}
                    
                    <div class="relative w-16 h-16 rounded-2xl my-2 flex items-center justify-center border-2 border-white/20 shadow-inner transform transition-transform" style="background: radial-gradient(circle at 30% 30%, #ffffff, ${skin.color}, ${skin.darkColor})">
                        <div class="w-4 h-4 rounded-full bg-white ml-5 -mt-4 border border-black shadow-sm"></div>
                    </div>
                    
                    <span class="font-game text-xs text-slate-100 tracking-wide mb-1.5">${skin.name}</span>
                    
                    <div class="w-full mt-1">
                        ${!isUnlocked ? `
                            <div class="flex items-center justify-center gap-1 mb-2 bg-black/40 py-1 px-2 rounded-xl border border-white/5">
                                <svg class="w-3.5 h-3.5 text-yellow-400 fill-current drop-shadow-[0_0_4px_rgba(250,204,21,0.6)]" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10" class="text-yellow-500 fill-current"/>
                                    <circle cx="12" cy="12" r="7" class="text-yellow-300 fill-current"/>
                                    <text x="12" y="16" font-size="10" font-weight="bold" text-anchor="middle" fill="#854d0e">$</text>
                                </svg>
                                <span class="text-xs font-black text-yellow-300 gold-glow">${skin.price}</span>
                            </div>
                        ` : ''}

                        <button class="btn-action w-full py-2.5 px-2 rounded-xl font-game text-xs transition-all flex items-center justify-center gap-1 ${
                            isActive
                                ? 'bg-slate-800/80 text-yellow-400 cursor-default border border-yellow-500/30 font-black'
                                : isUnlocked
                                ? 'bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white border border-emerald-300/40 shadow-md shadow-emerald-500/20'
                                : state.totalCoins >= skin.price
                                ? 'bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 border border-yellow-200/50 shadow-md shadow-amber-500/20 font-black'
                                : 'bg-slate-900 text-slate-600 cursor-not-allowed border border-slate-800'
                        }">
                            ${isActive ? 'EM USO' : isUnlocked ? 'EQUIPAR' : 'COMPRAR'}
                        </button>
                    </div>
                `;

                const btn = card.querySelector('button');
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isActive) return;

                    if (isUnlocked) {
                        state.activeSkin = skin.id;
                        saveData();
                        renderShop();
                    } else if (state.totalCoins >= skin.price) {
                        state.totalCoins -= skin.price;
                        state.unlockedSkins.push(skin.id);
                        state.activeSkin = skin.id;
                        saveData();
                        updateHUD();
                        renderShop();
                    }
                });

                skinsContainer.appendChild(card);
            });
        }

        function saveData() {
            const data = {
                totalCoins: state.totalCoins,
                highScore: state.highScore,
                activeSkin: state.activeSkin,
                unlockedSkins: state.unlockedSkins
            };
            localStorage.setItem('flappy_deluxe_save', JSON.stringify(data));
        }

        function loadData() {
            const data = localStorage.getItem('flappy_deluxe_save');
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    state.totalCoins = parsed.totalCoins || 0;
                    state.highScore = parsed.highScore || 0;
                    state.activeSkin = parsed.activeSkin || 'yellow';
                    state.unlockedSkins = parsed.unlockedSkins || ['yellow'];
                } catch (e) {
                    console.error("Erro ao carregar dados salvos:", e);
                }
            }
            updateHUD();
        }

        function handleTap(e) {
            if (e && e.preventDefault && e.cancelable) {
                e.preventDefault();
            }
            if (state.current === 'PLAYING') {
                bird.jump();
            }
        }

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('button') || e.target.closest('#shopModal')) return;
            handleTap(e);
        }, { passive: false });

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('button') || e.target.closest('#shopModal')) return;
            handleTap(e);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (state.current === 'PLAYING') bird.jump();
            }
        });

        btnStart.addEventListener('click', () => startGame());
        btnRestart.addEventListener('click', () => startGame());

        btnShop.addEventListener('click', () => {
            renderShop();
            shopModal.classList.remove('hidden');
        });

        btnCloseShop.addEventListener('click', () => {
            shopModal.classList.add('hidden');
        });

        btnBackMenu.addEventListener('click', () => {
            gameOverModal.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            updateHUD();
        });

        window.onload = () => {
            environment.init();
            bird.reset();
            loadData();
            gameLoop();
        };
    </script>
</body>
</html>
